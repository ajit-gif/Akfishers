<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://akfishers.com/admin">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Panel — AK Fishers</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230e4d6e'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Georgia'>AK</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/shared.css?v=9">
  <link rel="stylesheet" href="styles/admin.css?v=9">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <!-- ============ SIDEBAR ============ -->
    <aside class="admin-side">
      <div class="as-logo">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C7 3 3.2 5.6 1.5 9.2c-.3.7-.3 1.5 0 2.2C3.2 15 7 17.6 12 17.6s8.8-2.6 10.5-6.2c.3-.7.3-1.5 0-2.2C20.8 5.6 17 3 12 3zm0 3.4c1.2 0 2.2 1 2.2 2.2s-1 2.2-2.2 2.2-2.2-1-2.2-2.2 1-2.2 2.2-2.2z"/></svg></span>
        <span><b>AK Fishers</b><span>Admin Panel</span></span>
      </div>
      <nav id="adminNav">
        <a href="#" data-view="dashboard" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-8"/></svg> Dashboard</a>
        <a href="#" data-view="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg> Products</a>
        <a href="#" data-view="categories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Categories</a>
        <a href="#" data-view="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg> Orders</a>
        <a href="#" data-view="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg> Customers</a>
        <a href="#" data-view="delivery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg> Delivery</a>
        <a href="#" data-view="coupons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4L11 3H4v7l10.4 10.6a2 2 0 0 0 2.8 0l3.4-3.4a2 2 0 0 0 0-2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg> Coupons</a>
      </nav>
      <div class="as-back"><a href="/">← Back to Store</a><br><a href="#" id="adminLogout" style="display:inline-block;margin-top:8px">Sign out</a></div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="admin-main" id="adminMain"></main>
  </div>

  <!-- Product modal -->
  <div class="modal-backdrop" id="productModal">
    <div class="modal modal--lg">
      <button class="modal-close" data-close-modal><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:16px;height:16px"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      <h3 id="pmTitle">Add Product</h3>
      <p class="modal-sub">Fill in the product details below.</p>
      <div class="field-row">
        <div class="field"><label>Product Name</label><input id="pmName" placeholder="e.g. Black Pomfret"></div>
        <div class="field"><label>Marathi Name</label><input id="pmMarathi" placeholder="e.g. काळा पापलेट"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Category</label><select id="pmCat"></select></div>
        <div class="field"><label>Price (₹ / kg)</label><input id="pmPrice" type="number" min="1" placeholder="e.g. 1150"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Upper price (₹ / kg)</label><input id="pmOldPrice" type="number" min="0" placeholder="e.g. 2250"></div>
        <div class="field"><label>Stock (kg)</label><input id="pmStock" type="number" min="0" placeholder="e.g. 24"></div>
      </div>
      <div class="field"><label>Description</label><textarea id="pmDesc" placeholder="Short product description"></textarea></div>
      <div class="field"><label>Image URL</label><input id="pmImg" placeholder="https://… (paste an image URL)"></div>
      <div class="field-row">
        <div class="field"><label>Badge</label><select id="pmBadge"><option value="">None</option><option value="bestseller">Best Seller</option><option value="new">New Arrival</option></select></div>
        <div class="field"><label>Weights (g, comma separated)</label><input id="pmWeights" placeholder="250, 500, 1000, 2000"></div>
      </div>
      <div class="field"><label>Cuts (comma separated)</label><input id="pmCuts" placeholder="Whole, Cleaned, Curry Cut, Steak Cut, Fillet"></div>
      <div class="flex gap-12 mt-16">
        <button class="btn btn--primary" id="pmSave">Save Product</button>
        <button class="btn btn--ghost" data-close-modal>Cancel</button>
      </div>
    </div>
  </div>

  <!-- Coupon modal -->
  <div class="modal-backdrop" id="couponModal">
    <div class="modal">
      <button class="modal-close" data-close-modal><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:16px;height:16px"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      <h3>Create Coupon</h3>
      <p class="modal-sub">Create a discount coupon for customers.</p>
      <div class="field"><label>Coupon Code</label><input id="cpCode" placeholder="e.g. FRESH15" style="text-transform:uppercase"></div>
      <div class="field-row">
        <div class="field"><label>Type</label><select id="cpType"><option value="percent">Percentage (%)</option><option value="fixed">Fixed (₹)</option></select></div>
        <div class="field"><label>Value</label><input id="cpValue" type="number" min="1" placeholder="e.g. 10 or 100"></div>
      </div>
      <div class="field"><label>Minimum Order (₹)</label><input id="cpMin" type="number" min="0" placeholder="e.g. 499"></div>
      <div class="field"><label>Description</label><input id="cpDesc" placeholder="e.g. 10% off on orders above ₹499"></div>
      <div class="flex gap-12 mt-16">
        <button class="btn btn--primary" id="cpSave">Create Coupon</button>
        <button class="btn btn--ghost" data-close-modal>Cancel</button>
      </div>
    </div>
  </div>

  <script src="scripts/products.js?v=9"></script>
  <script src="scripts/app.js?v=9"></script>
  <script>
    (function () {
      "use strict";

      var main = document.getElementById("adminMain");
      var currentView = "dashboard";

      /* ---------- API helper ---------- */
      function api(path, body) {
        var opts = { credentials: "same-origin", headers: { "Accept": "application/json" } };
        if (body !== undefined) {
          opts.method = "POST";
          opts.headers["Content-Type"] = "application/json";
          opts.body = JSON.stringify(body);
        }
        return fetch("/api/" + path, opts).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, ok: r.ok, body: b || {} }; });
        }).catch(function () { return { status: 0, ok: false, body: { message: "Network error." } }; });
      }

      /* server-loaded data, refreshed per view */
      var ADMIN = { orders: [], stats: null, zones: [] };

      /* ---------- Server-side admin gate ---------- */
      function showAdminLogin(msg) {
        document.querySelector(".admin-side").style.display = "none";
        main.innerHTML =
          '<div class="admin-topbar"><div><h1>Admin sign-in</h1>' +
            '<div class="at-sub">Sign in with an authorised admin account.</div></div></div>' +
          '<div class="admin-card" style="max-width:420px">' +
            '<div id="admAlert" class="form-alert' + (msg ? ' err' : '') + '">' + (msg || "") + '</div>' +
            '<div class="field"><label for="admId">Mobile number or email</label><input id="admId" type="text" autocomplete="username"></div>' +
            '<div class="field"><label for="admPw">Password</label><input id="admPw" type="password" autocomplete="current-password"></div>' +
            '<button class="btn btn--primary btn--block" id="admLogin">Sign in</button>' +
            '<p class="text-muted" style="font-size:12.5px;margin-top:12px">Access is granted per account (role = admin). Contact the site owner if you need access.</p>' +
          '</div>';
        var go = function () {
          var btn = document.getElementById("admLogin");
          if (btn.disabled) return;
          btn.disabled = true; btn.classList.add("is-busy");
          api("login.php", { identifier: document.getElementById("admId").value.trim(), password: document.getElementById("admPw").value })
            .then(function (res) {
              if (!res.ok) {
                btn.disabled = false; btn.classList.remove("is-busy");
                var a = document.getElementById("admAlert"); a.className = "form-alert err"; a.textContent = res.body.message || "Sign in failed.";
                return;
              }
              return api("admin/me.php").then(function (m) {
                if (m.ok && m.body.admin) { location.reload(); }
                else {
                  btn.disabled = false; btn.classList.remove("is-busy");
                  var a = document.getElementById("admAlert"); a.className = "form-alert err";
                  a.textContent = "This account is not an admin.";
                  api("logout.php", {});
                }
              });
            });
        };
        document.getElementById("admLogin").addEventListener("click", go);
        document.getElementById("admPw").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
      }

      /* ---------- Icons ---------- */
      var I = window.AKF_ICONS;

      function getCoupons() { try { return JSON.parse(localStorage.getItem("akf_admin_coupons")) || AKF_COUPONS.slice(); } catch (e) { return AKF_COUPONS.slice(); } }
      function setCoupons(c) { localStorage.setItem("akf_admin_coupons", JSON.stringify(c)); }
      function customersFromOrders() {
        var seen = {};
        ADMIN.orders.forEach(function (o) {
          var k = o.phone || o.name;
          if (!seen[k]) seen[k] = { name: o.name, phone: o.phone, orders: 0, total: 0, last: o.placedOn, registered: o.registered };
          seen[k].orders++; seen[k].total += (o.total || 0);
        });
        return Object.keys(seen).map(function (k) { return seen[k]; });
      }
      var CLIENT_ONLY_NOTE = '<div class="cs-note" style="background:#fdf3e0;color:#b97a12;margin-bottom:16px">⚠ Catalogue edits on this screen are a local preview only — they are not yet saved to the server. Product data still lives in <code>scripts/products.js</code>.</div>';

      /* ---------- Views ---------- */
      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

      function renderDashboard() {
        var s = ADMIN.stats || {};
        var recent = ADMIN.orders.slice(0, 6);
        main.innerHTML =
          '<div class="admin-topbar">' +
            '<div><h1>Dashboard</h1><div class="at-sub">Your store at a glance.</div></div>' +
            '<div class="at-actions"><a class="btn btn--primary btn--sm" href="/shop">View Store</a></div>' +
          '</div>' +
          '<div class="stat-grid">' +
            '<div class="stat-card"><span class="sc-icon blue">' + I.doc + '</span><span><b>' + (s.ordersTotal || 0) + '</b><span>Total Orders</span>' + (s.ordersOpen ? '<span class="sc-trend up">' + s.ordersOpen + ' open</span>' : '') + '</span></div>' +
            '<div class="stat-card"><span class="sc-icon green">' + I.wallet + '</span><span><b>' + akfFormatINR(s.revenue || 0) + '</b><span>Revenue</span></span></div>' +
            '<div class="stat-card"><span class="sc-icon amber">' + I.users + '</span><span><b>' + (s.customers || 0) + '</b><span>Customers</span><span class="sc-trend up">' + (s.registered || 0) + ' with accounts</span></span></div>' +
            '<div class="stat-card"><span class="sc-icon red">' + I.box + '</span><span><b>' + AKF_PRODUCTS.length + '</b><span>Products Live</span><span class="sc-trend up">' + (s.last7 || 0) + ' orders / 7 days</span></span></div>' +
          '</div>' +
          '<div class="admin-card">' +
            '<div class="ac-head"><h3>Recent Orders</h3><a class="btn btn--ghost btn--sm" href="#" data-goto="orders">View All</a></div>' +
            (recent.length ? '<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>' +
              recent.map(function (o) {
                return '<tr><td><b>#' + esc(o.id) + '</b><br><span class="text-muted">' + esc(o.placedOn) + '</span></td>' +
                  '<td>' + esc(o.name) + '<br><span class="text-muted">' + esc(o.phone) + '</span></td>' +
                  '<td>' + (o.items ? o.items.length : 0) + ' item(s)</td>' +
                  '<td><b>' + akfFormatINR(o.total) + '</b></td>' +
                  '<td><span class="badge badge--stock">' + esc(o.status) + '</span></td></tr>';
              }).join("") +
            '</tbody></table></div>' : '<p class="text-muted">No orders yet.</p>') +
          '</div>';
      }

      function renderProducts() {
        main.innerHTML =
          '<div class="admin-topbar">' +
            '<div><h1>Products</h1><div class="at-sub">' + AKF_PRODUCTS.length + ' products in catalogue</div></div>' +
            '<div class="at-actions"><button class="btn btn--primary btn--sm" id="addProduct">+ Add Product</button></div>' +
          '</div>' +
          CLIENT_ONLY_NOTE +
          '<div class="admin-card">' +
            '<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Sold</th><th>Rating</th><th>Actions</th></tr></thead><tbody>' +
            AKF_PRODUCTS.map(function (p) {
              var stockClass = p.stock === 0 ? "out" : p.stock < 10 ? "low" : "in";
              var stockLabel = p.stock === 0 ? "Out of stock" : p.stock < 10 ? "Low: " + p.stock + "kg" : "In stock: " + p.stock + "kg";
              return '<tr>' +
                '<td><div class="t-prod"><img src="' + p.img + '" alt=""><span><b>' + p.name + '</b><span>' + p.marathi + '</span></span></div></td>' +
                '<td>' + p.category + '</td>' +
                '<td><b>' + akfFormatINR(p.price) + '</b>/kg' + (p.oldPrice ? '<br><span class="text-muted" style="text-decoration:line-through">' + akfFormatINR(p.oldPrice) + '</span>' : '') + '</td>' +
                '<td><span class="stock-pill ' + stockClass + '">' + stockLabel + '</span></td>' +
                '<td>' + p.sold.toLocaleString("en-IN") + '</td>' +
                '<td>★ ' + p.rating + '</td>' +
                '<td><div class="t-actions">' +
                  '<button class="ta-edit" data-edit="' + p.id + '" title="Edit">' + I.edit + '</button>' +
                  '<button class="ta-del" data-del="' + p.id + '" title="Delete">' + I.trash + '</button>' +
                '</div></td></tr>';
            }).join("") +
            '</tbody></table></div>' +
          '</div>';
        bindProductActions();
      }

      function bindProductActions() {
        document.getElementById("addProduct").addEventListener("click", function () { openProductModal(null); });
        document.querySelectorAll("[data-edit]").forEach(function (b) {
          b.addEventListener("click", function () { openProductModal(b.getAttribute("data-edit")); });
        });
        document.querySelectorAll("[data-del]").forEach(function (b) {
          b.addEventListener("click", function () {
            var id = b.getAttribute("data-del");
            var p = akfGetProduct(id);
            if (confirm('Delete "' + p.name + '" from catalogue?')) {
              var idx = AKF_PRODUCTS.findIndex(function (x) { return x.id === id; });
              if (idx > -1) AKF_PRODUCTS.splice(idx, 1);
              akfPersistCatalogue();
              AKF_TOAST(p.name + " deleted", "info");
              renderProducts();
            }
          });
        });
      }

      function openProductModal(id) {
        var p = id ? akfGetProduct(id) : null;
        document.getElementById("pmTitle").textContent = p ? "Edit Product" : "Add Product";
        document.getElementById("pmName").value = p ? p.name : "";
        document.getElementById("pmMarathi").value = p ? p.marathi : "";
        document.getElementById("pmPrice").value = p ? p.price : "";
        document.getElementById("pmOldPrice").value = p && p.priceMax ? p.priceMax : "";
        document.getElementById("pmStock").value = p ? p.stock : "";
        document.getElementById("pmDesc").value = p ? p.desc : "";
        document.getElementById("pmImg").value = p ? p.img : "";
        document.getElementById("pmBadge").value = p ? p.badge : "";
        document.getElementById("pmWeights").value = p ? p.weights.join(", ") : "250, 500, 1000, 2000";
        document.getElementById("pmCuts").value = p ? p.cuts.join(", ") : "Whole, Cleaned, Curry Cut, Steak Cut, Fillet";
        var catSel = document.getElementById("pmCat");
        catSel.innerHTML = AKF_CATEGORIES.map(function (c) {
          return '<option value="' + c.id + '"' + (p && p.category === c.id ? " selected" : "") + '>' + c.name + '</option>';
        }).join("");
        document.getElementById("productModal").classList.add("open");
        document.getElementById("productModal").dataset.editing = p ? p.id : "";
      }

      function renderCategories() {
        main.innerHTML =
          '<div class="admin-topbar">' +
            '<div><h1>Categories</h1><div class="at-sub">Manage your store categories</div></div>' +
            '<div class="at-actions"><button class="btn btn--primary btn--sm" id="addCat">+ Add Category</button></div>' +
          '</div>' +
          CLIENT_ONLY_NOTE +
          '<div class="admin-card">' +
            '<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Category</th><th>Marathi</th><th>Products</th><th>Actions</th></tr></thead><tbody>' +
            AKF_CATEGORIES.map(function (c, i) {
              return '<tr><td><div class="t-prod"><img src="' + c.img + '" alt=""><span><b>' + c.name + '</b><span>' + c.desc + '</span></span></div></td>' +
                '<td>' + c.marathi + '</td>' +
                '<td>' + akfCategoryCount(c.id) + ' products</td>' +
                '<td><div class="t-actions">' +
                  '<button class="ta-edit" data-cat-edit="' + i + '" title="Edit">' + I.edit + '</button>' +
                  '<button class="ta-del" data-cat-del="' + i + '" title="Delete">' + I.trash + '</button>' +
                '</div></td></tr>';
            }).join("") +
            '</tbody></table></div>' +
          '</div>';

        document.getElementById("addCat").addEventListener("click", function () {
          var name = prompt("Category name (e.g. Tuna):");
          if (!name) return;
          var marathi = prompt("Marathi name:") || "";
          var id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
          AKF_CATEGORIES.push({ id: id, name: name, marathi: marathi, img: AKF_CATEGORIES[0].img, desc: "New category" });
          akfPersistCatalogue();
          AKF_TOAST("Category added", "success");
          renderCategories();
        });
        document.querySelectorAll("[data-cat-edit]").forEach(function (b) {
          b.addEventListener("click", function () {
            var i = parseInt(b.getAttribute("data-cat-edit"), 10);
            var c = AKF_CATEGORIES[i];
            var name = prompt("Category name:", c.name);
            if (name) { c.name = name; akfPersistCatalogue(); AKF_TOAST("Category updated", "success"); renderCategories(); }
          });
        });
        document.querySelectorAll("[data-cat-del]").forEach(function (b) {
          b.addEventListener("click", function () {
            var i = parseInt(b.getAttribute("data-cat-del"), 10);
            var c = AKF_CATEGORIES[i];
            if (confirm('Delete category "' + c.name + '"?')) {
              AKF_CATEGORIES.splice(i, 1);
              akfPersistCatalogue();
              AKF_TOAST("Category deleted", "info");
              renderCategories();
            }
          });
        });
      }

      function renderOrders() {
        var orders = ADMIN.orders;
        main.innerHTML =
          '<div class="admin-topbar">' +
            '<div><h1>Orders</h1><div class="at-sub">' + orders.length + ' orders (most recent first)</div></div>' +
            '<div class="at-actions"><button class="btn btn--ghost btn--sm" id="ordReload">Refresh</button></div>' +
          '</div>' +
          (orders.length ? orders.map(function (o) {
            var sc = o.status === "delivered" ? "delivered" : o.status === "cancelled" ? "cancelled" : o.status === "out" ? "out" : o.status === "packed" ? "packed" : "confirmed";
            return '<div class="admin-card">' +
              '<div class="ac-head">' +
                '<div><h3>#' + esc(o.id) + ' <span class="text-muted" style="font-size:13px;font-weight:500">· ' + esc(o.placedOn) + '</span>' + (o.registered ? '' : ' <span class="badge badge--stock">guest</span>') + '</h3>' +
                '<div class="ac-sub">' + esc(o.name) + ' · ' + esc(o.phone) + (o.email ? ' · ' + esc(o.email) : '') + ' · ' + esc(o.payment) + '</div></div>' +
                '<select class="status-select ' + sc + '" data-status="' + esc(o.id) + '">' +
                  ['confirmed', 'packed', 'out', 'delivered', 'cancelled'].map(function (v) {
                    var lbl = { confirmed: 'Confirmed', packed: 'Packed', out: 'Out for Delivery', delivered: 'Delivered', cancelled: 'Cancelled' }[v];
                    return '<option value="' + v + '"' + (o.status === v ? ' selected' : '') + '>' + lbl + '</option>';
                  }).join("") +
                '</select>' +
              '</div>' +
              '<div class="admin-grid-2">' +
                '<div><div class="ac-sub" style="margin-bottom:8px">Items</div>' +
                  (o.items || []).map(function (i) {
                    return '<div class="area-row"><span style="flex:1"><b>' + esc(i.name) + '</b><br><span class="text-muted">' +
                      (i.weight >= 1000 ? i.weight / 1000 + "kg" : i.weight + "g") + ' · ' + esc(i.cut) + ' · Qty ' + i.qty + '</span></span>' +
                      '<b>' + akfFormatINR(i.price) + '</b></div>';
                  }).join("") +
                  (o.discount ? '<div class="area-row"><span style="flex:1" class="text-muted">Coupon ' + esc(o.coupon || '') + '</span><b class="text-success">− ' + akfFormatINR(o.discount) + '</b></div>' : '') +
                  '<div class="area-row"><span style="flex:1" class="text-muted">Delivery</span><b>' + (o.deliveryCharge ? akfFormatINR(o.deliveryCharge) : 'FREE') + '</b></div>' +
                  '<div class="area-row"><span style="flex:1"></span><b>Total: ' + akfFormatINR(o.total) + '</b></div>' +
                '</div>' +
                '<div><div class="ac-sub" style="margin-bottom:8px">Delivery</div>' +
                  '<div class="cs-note">📍 ' + esc(o.address) + '<br>📅 ' + esc(o.deliveryDate) + ' · ' + esc(o.slot) + '</div></div>' +
              '</div>' +
            '</div>';
          }).join("") : '<div class="admin-card"><p class="text-muted">No orders yet.</p></div>');

        var rl = document.getElementById("ordReload");
        if (rl) rl.addEventListener("click", function () { loadAdminData().then(function () { renderOrders(); }); });

        document.querySelectorAll("[data-status]").forEach(function (sel) {
          sel.addEventListener("change", function () {
            var id = sel.getAttribute("data-status");
            var newStatus = sel.value;
            sel.disabled = true;
            api("admin/orders.php", { op: "status", id: id, status: newStatus }).then(function (res) {
              sel.disabled = false;
              if (res.ok) {
                var o = ADMIN.orders.find(function (x) { return x.id === id; });
                if (o) o.status = newStatus;
                sel.className = "status-select " + newStatus;
                AKF_TOAST("Order #" + id + " → " + newStatus, "success");
              } else if (res.status === 401 || res.status === 403) {
                location.reload();
              } else {
                AKF_TOAST(res.body.message || "Could not update status.", "error");
                loadAdminData().then(function () { renderOrders(); });
              }
            });
          });
        });
      }

      function renderCustomers() {
        var customers = customersFromOrders().sort(function (a, b) { return b.total - a.total; });
        main.innerHTML =
          '<div class="admin-topbar">' +
            '<div><h1>Customers</h1><div class="at-sub">' + customers.length + ' customers (from orders)</div></div>' +
          '</div>' +
          '<div class="admin-card">' +
            '<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Customer</th><th>Mobile</th><th>Account</th><th>Orders</th><th>Total</th><th>Last Order</th></tr></thead><tbody>' +
            (customers.length ? customers.map(function (c) {
              return '<tr><td><div class="t-prod"><span style="width:40px;height:40px;border-radius:50%;background:var(--ocean-100);color:var(--ocean-700);display:grid;place-items:center;font-weight:700">' + esc((c.name || "?").charAt(0)) + '</span><span><b>' + esc(c.name) + '</b></span></div></td>' +
                '<td>' + esc(c.phone) + '</td>' +
                '<td>' + (c.registered ? '<span class="badge badge--new">Registered</span>' : '<span class="text-muted">Guest</span>') + '</td>' +
                '<td>' + c.orders + '</td>' +
                '<td><b>' + akfFormatINR(c.total) + '</b></td>' +
                '<td>' + esc(c.last) + '</td></tr>';
            }).join("") : '<tr><td colspan="6" class="text-muted">No customers yet</td></tr>') +
            '</tbody></table></div>' +
          '</div>';
      }

      function renderDelivery() {
        var zones = ADMIN.zones;
        main.innerHTML =
          '<div class="admin-topbar">' +
            '<div><h1>Delivery Management</h1><div class="at-sub">' + zones.length + ' delivery zones · Free delivery above ₹999</div></div>' +
          '</div>' +
          '<div class="admin-grid-2">' +
            '<div class="admin-card">' +
              '<div class="ac-head"><h3>Delivery Zones &amp; Charges</h3><span class="text-muted" style="font-size:12px">saved to server</span></div>' +
              '<div style="max-height:520px;overflow-y:auto">' +
                zones.map(function (z) {
                  return '<div class="area-row">' +
                    '<span class="ar-area" style="flex:1"><b>' + esc(z.name) + '</b></span>' +
                    '<input type="number" value="' + z.charge + '" data-charge="' + esc(z.id) + '" min="0" max="999" style="width:80px">' +
                    '<span class="text-muted" style="font-size:12px">₹</span>' +
                  '</div>';
                }).join("") +
              '</div>' +
            '</div>' +
            '<div>' +
              '<div class="admin-card">' +
                '<div class="ac-head"><h3>Check Pincode</h3></div>' +
                '<div class="input-group">' +
                  '<input type="text" maxlength="6" id="pinLookup" placeholder="Enter pincode to check">' +
                  '<button class="btn btn--primary" id="pinLookupBtn">Check</button>' +
                '</div>' +
                '<div class="pincode-result" id="pinLookupResult"></div>' +
              '</div>' +
              '<div class="admin-card">' +
                '<div class="ac-head"><h3>Delivery Policy</h3></div>' +
                '<ul style="font-size:13.5px;color:var(--ink-soft);line-height:2">' +
                  '<li>• Free delivery on orders above ₹999</li>' +
                  '<li>• Delivery charge is set per zone (₹49 – ₹79)</li>' +
                  '<li>• Orders to be placed 1 day in advance</li>' +
                  '<li>• Advance orders accepted for bulk &amp; festivals</li>' +
                  '<li>• Temperature-controlled insulated packaging</li>' +
                '</ul>' +
              '</div>' +
            '</div>' +
          '</div>';

        document.querySelectorAll("[data-charge]").forEach(function (inp) {
          inp.addEventListener("change", function () {
            var zid = inp.getAttribute("data-charge");
            var charge = parseInt(inp.value, 10);
            if (isNaN(charge) || charge < 0 || charge > 999) { AKF_TOAST("Charge must be 0–999", "error"); return; }
            inp.disabled = true;
            api("admin/zones.php", { op: "charge", id: zid, charge: charge }).then(function (res) {
              inp.disabled = false;
              if (res.ok) { ADMIN.zones = res.body.zones || ADMIN.zones; AKF_TOAST("Zone charge saved", "success"); }
              else if (res.status === 401 || res.status === 403) { location.reload(); }
              else AKF_TOAST(res.body.message || "Could not save.", "error");
            });
          });
        });

        document.getElementById("pinLookupBtn").addEventListener("click", function () {
          var val = document.getElementById("pinLookup").value.trim();
          var res = document.getElementById("pinLookupResult");
          if (!/^\d{6}$/.test(val)) { res.className = "pincode-result no"; res.textContent = "Enter a valid pincode"; return; }
          var area = akfFindArea(val);
          if (area) { res.className = "pincode-result ok"; res.textContent = "✓ " + area.area + " — delivery charge ₹" + area.charge; }
          else { res.className = "pincode-result no"; res.textContent = "✗ Not serviced yet"; }
        });
      }

      function renderCoupons() {
        var coupons = getCoupons();
        main.innerHTML =
          '<div class="admin-topbar">' +
            '<div><h1>Coupons</h1><div class="at-sub">' + coupons.length + ' active coupons</div></div>' +
            '<div class="at-actions"><button class="btn btn--primary btn--sm" id="addCoupon">+ Create Coupon</button></div>' +
          '</div>' +
          CLIENT_ONLY_NOTE +
          '<div class="admin-grid-3">' +
            coupons.map(function (c, i) {
              return '<div class="coupon-card">' +
                '<button class="cc-del" data-coupon-del="' + i + '" title="Delete">' + I.trash + '</button>' +
                '<div class="cc-code">' + c.code + '</div>' +
                '<div class="cc-desc">' + c.desc + '</div>' +
                '<div class="cc-meta">' + (c.type === "percent" ? c.value + "% off" : akfFormatINR(c.value) + " off") + ' · Min order ' + akfFormatINR(c.min) + '</div>' +
              '</div>';
            }).join("") +
          '</div>';

        document.getElementById("addCoupon").addEventListener("click", function () {
          document.getElementById("couponModal").classList.add("open");
        });
        document.querySelectorAll("[data-coupon-del]").forEach(function (b) {
          b.addEventListener("click", function () {
            var i = parseInt(b.getAttribute("data-coupon-del"), 10);
            var coupons = getCoupons();
            if (confirm('Delete coupon "' + coupons[i].code + '"?')) {
              coupons.splice(i, 1);
              setCoupons(coupons);
              AKF_TOAST("Coupon deleted", "info");
              renderCoupons();
            }
          });
        });
      }

      /* ---------- Sign out ---------- */
      var logoutLink = document.getElementById("adminLogout");
      if (logoutLink) {
        logoutLink.addEventListener("click", function (e) {
          e.preventDefault();
          api("logout.php", {}).then(function () { location.href = "/"; });
        });
      }

      function loadAdminData() {
        return Promise.all([api("admin/stats.php"), api("admin/orders.php"), api("admin/zones.php")]).then(function (r) {
          if (r[0].ok) ADMIN.stats = r[0].body.stats;
          if (r[1].ok) ADMIN.orders = r[1].body.orders || [];
          if (r[2].ok) ADMIN.zones = r[2].body.zones || [];
          if ([r[0], r[1], r[2]].some(function (x) { return x.status === 401 || x.status === 403; })) location.reload();
        });
      }

      /* ---------- Navigation ---------- */
      document.getElementById("adminNav").addEventListener("click", function (e) {
        var link = e.target.closest("[data-view]");
        if (!link) return;
        e.preventDefault();
        currentView = link.getAttribute("data-view");
        document.querySelectorAll("[data-view]").forEach(function (x) { x.classList.remove("active"); });
        link.classList.add("active");
        switchView(currentView);
      });

      function switchView(v) {
        var serverViews = { dashboard: 1, orders: 1, customers: 1, delivery: 1 };
        var draw = function () {
          if (v === "dashboard") renderDashboard();
          else if (v === "products") renderProducts();
          else if (v === "categories") renderCategories();
          else if (v === "orders") renderOrders();
          else if (v === "customers") renderCustomers();
          else if (v === "delivery") renderDelivery();
          else if (v === "coupons") renderCoupons();
        };
        if (serverViews[v]) {
          main.innerHTML = '<div class="admin-topbar"><div><h1>Loading…</h1></div></div>';
          loadAdminData().then(draw);
        } else {
          draw();
        }
      }

      /* ---------- Modal events ---------- */
      document.querySelectorAll("[data-close-modal]").forEach(function (b) {
        b.addEventListener("click", function () {
          b.closest(".modal-backdrop").classList.remove("open");
        });
      });
      document.querySelectorAll(".modal-backdrop").forEach(function (m) {
        m.addEventListener("click", function (e) { if (e.target === m) m.classList.remove("open"); });
      });

      // Save product
      document.getElementById("pmSave").addEventListener("click", function () {
        var name = document.getElementById("pmName").value.trim();
        var marathi = document.getElementById("pmMarathi").value.trim();
        var price = parseFloat(document.getElementById("pmPrice").value);
        var stock = parseInt(document.getElementById("pmStock").value, 10) || 0;
        var desc = document.getElementById("pmDesc").value.trim();
        var img = document.getElementById("pmImg").value.trim();
        var badge = document.getElementById("pmBadge").value;
        var cat = document.getElementById("pmCat").value;
        var weights = document.getElementById("pmWeights").value.split(",").map(function (w) { return parseInt(w.trim(), 10); }).filter(function (w) { return w > 0; });
        var cuts = document.getElementById("pmCuts").value.split(",").map(function (c) { return c.trim(); }).filter(Boolean);

        if (!name || !price || !desc || !img || !weights.length || !cuts.length) {
          AKF_TOAST("Please fill all required fields", "error");
          return;
        }

        var editing = document.getElementById("productModal").dataset.editing;
        var oldPrice = parseFloat(document.getElementById("pmOldPrice").value) || 0;

        if (editing) {
          var p = akfGetProduct(editing);
          if (p) {
            p.name = name; p.marathi = marathi; p.price = price;
            p.priceMax = oldPrice > price ? oldPrice : price;
            p.oldPrice = 0;
            p.stock = stock; p.desc = desc; p.img = img; p.badge = badge; p.category = cat;
            p.weights = weights; p.cuts = cuts;
          }
          AKF_TOAST("Product updated", "success");
        } else {
          var id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + Date.now().toString().slice(-4);
          AKF_PRODUCTS.unshift({
            id: id, name: name, marathi: marathi, category: cat, desc: desc,
            price: price, priceMax: oldPrice > price ? oldPrice : price, oldPrice: oldPrice, unit: "kg", rating: 0, reviews: 0, sold: 0,
            badge: badge, stock: stock, isNew: badge === "new",
            weights: weights, cuts: cuts, img: img, gallery: [img],
            tags: ["Fresh Catch"], storage: "Store at 0–4°C and cook within 24 hours for best taste.",
            nutrition: ["High in protein"]
          });
          AKF_TOAST("Product added to catalogue", "success");
        }
        akfPersistCatalogue();
        document.getElementById("productModal").classList.remove("open");
        renderProducts();
      });

      // Save coupon
      document.getElementById("cpSave").addEventListener("click", function () {
        var code = document.getElementById("cpCode").value.trim().toUpperCase();
        var type = document.getElementById("cpType").value;
        var value = parseFloat(document.getElementById("cpValue").value);
        var min = parseFloat(document.getElementById("cpMin").value) || 0;
        var desc = document.getElementById("cpDesc").value.trim();
        if (!code || !value) { AKF_TOAST("Enter code and value", "error"); return; }
        var coupons = getCoupons();
        coupons.push({ code: code, type: type, value: value, min: min, desc: desc || (type === "percent" ? value + "% off" : akfFormatINR(value) + " off") });
        setCoupons(coupons);
        AKF_TOAST("Coupon " + code + " created", "success");
        document.getElementById("couponModal").classList.remove("open");
        renderCoupons();
      });

      // Goto links
      main.addEventListener("click", function (e) {
        var goto = e.target.closest("[data-goto]");
        if (goto) {
          e.preventDefault();
          var v = goto.getAttribute("data-goto");
          document.querySelectorAll("[data-view]").forEach(function (x) { x.classList.remove("active"); });
          document.querySelector('[data-view="' + v + '"]').classList.add("active");
          switchView(v);
        }
      });

      /* ---------- Gate: require a server-side admin session ---------- */
      api("admin/me.php").then(function (res) {
        if (res.ok && res.body.admin) {
          document.querySelector(".admin-side").style.display = "";
          switchView("dashboard");
        } else if (res.status === 503) {
          document.querySelector(".admin-side").style.display = "none";
          main.innerHTML = '<div class="admin-topbar"><div><h1>Admin</h1><div class="at-sub">The backend is not configured yet — run the database setup, then sign in.</div></div></div>';
        } else {
          showAdminLogin();
        }
      });
    })();
  </script>
</body>
</html>
