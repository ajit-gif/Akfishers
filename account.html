<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://akfishers.com/account">
  <meta name="robots" content="noindex, nofollow">
  <title>My Account — AK Fishers</title>
  <meta name="description" content="Login, signup and manage your AK Fishers account — profile, addresses, orders and tracking.">
  <link rel="icon" type="image/png" href="/assets/images/favicon.png?v=20">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png?v=20">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/shared.css?v=20">
</head>
<body>

  <header class="site-header"></header>

  <main id="accountRoot">
    <section class="section"><div class="container"><p class="text-muted">Loading…</p></div></section>
  </main>

  <footer class="site-footer"></footer>

  <script src="scripts/products.js?v=20"></script>
  <script src="scripts/app.js?v=20"></script>
  <script>
    (function () {
      "use strict";

      var root = document.getElementById("accountRoot");
      var user = null;              // set from the server (/api/me.php)
      var busy = false;
      var DASH = { orders: [], addresses: [] };

      function api(path, body) {
        var opts = { credentials: "same-origin", headers: { "Accept": "application/json" } };
        if (body !== undefined) {
          opts.method = "POST";
          opts.headers["Content-Type"] = "application/json";
          opts.body = JSON.stringify(body);
        }
        return fetch("/api/" + path, opts).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, ok: r.ok, body: b || {} }; });
        }).catch(function () { return { status: 0, ok: false, body: { error: "network", message: "Network error." } }; });
      }
      function localOrders() {
        try { return JSON.parse(localStorage.getItem("akf_orders")) || []; } catch (e) { return []; }
      }

      /* Any leftover data from the old client-only "login" — used only to
         pre-fill the sign-up form once, then discarded. */
      var legacy = (function () {
        try { return JSON.parse(localStorage.getItem("akf_user")) || null; } catch (e) { return null; }
      })();

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      /* ---------------- shared form helpers ---------------- */
      function field(id, label, o) {
        o = o || {};
        return '<div class="field" data-field="' + id + '">' +
          '<label for="' + id + '">' + esc(label) +
            (o.optional ? ' <span class="hint">(optional)</span>' : '') + '</label>' +
          '<input id="' + id + '" name="' + id + '"' +
            (o.type ? ' type="' + o.type + '"' : '') +
            (o.inputmode ? ' inputmode="' + o.inputmode + '"' : '') +
            (o.autocomplete ? ' autocomplete="' + o.autocomplete + '"' : '') +
            (o.maxlength ? ' maxlength="' + o.maxlength + '"' : '') +
            (o.placeholder ? ' placeholder="' + esc(o.placeholder) + '"' : '') +
            (o.value ? ' value="' + esc(o.value) + '"' : '') +
            ' aria-describedby="' + id + '-err">' +
          '<div class="field-error" id="' + id + '-err" role="alert" aria-live="polite"></div>' +
        '</div>';
      }
      function fieldError(id, msg) {
        var f = root.querySelector('[data-field="' + id + '"]');
        if (!f) return;
        f.classList.toggle("has-error", !!msg);
        var inp = f.querySelector("input");
        if (inp) inp.setAttribute("aria-invalid", msg ? "true" : "false");
        var e = f.querySelector(".field-error");
        if (e) e.textContent = msg || "";
      }
      function clearErrors() {
        root.querySelectorAll('[data-field]').forEach(function (f) {
          f.classList.remove("has-error");
          var e = f.querySelector(".field-error"); if (e) e.textContent = "";
        });
        alertBox("");
      }
      function alertBox(msg, kind) {
        var b = root.querySelector("#authAlert");
        if (!b) return;
        b.className = "form-alert" + (msg ? " " + (kind || "err") : "");
        b.textContent = msg || "";
      }
      function setBusy(btn, on, label) {
        busy = on;
        if (!btn) return;
        btn.disabled = on;
        btn.classList.toggle("is-busy", on);
        if (on) {
          btn.setAttribute("aria-busy", "true");
          if (!btn.dataset.label) btn.dataset.label = btn.textContent;
          btn.textContent = label || btn.dataset.label;
        } else {
          btn.removeAttribute("aria-busy");
          if (btn.dataset.label) btn.textContent = btn.dataset.label;
        }
      }
      function applyServerFieldErrors(fields, map) {
        if (!fields) return false;
        var shown = false;
        Object.keys(fields).forEach(function (k) {
          var id = (map && map[k]) || k;
          fieldError(id, fields[k]); shown = true;
        });
        return shown;
      }

      /* ================= AUTH VIEW ================= */
      var VISUAL =
        '<div class="auth-visual">' +
          '<img src="/assets/images/products/prawns.jpg" alt="Fresh prawns">' +
          '<div class="av-content">' +
            '<h2>Fresh seafood, one login away</h2>' +
            '<p>Track orders, save addresses, reorder favourites and get exclusive member offers.</p>' +
            '<ul class="av-points">' +
              '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Order tracking &amp; history</li>' +
              '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Saved delivery addresses</li>' +
              '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Member-only coupons</li>' +
              '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> One-tap reorder</li>' +
            '</ul>' +
          '</div>' +
        '</div>';

      function renderAuth(mode) {
        mode = mode || "login";
        root.innerHTML =
          '<div class="auth-layout">' + VISUAL +
            '<div class="auth-form-wrap"><div class="auth-card">' +
              '<div id="authAlert" class="form-alert" role="alert" aria-live="assertive"></div>' +
              (mode === "login" ? loginView() : mode === "signup" ? signupView() : forgotView()) +
            '</div></div>' +
          '</div>';
        bindAuth(mode);
        var first = root.querySelector(".auth-card input");
        if (first) try { first.focus(); } catch (e) {}
      }

      function loginView() {
        return '<h1>Welcome back</h1>' +
          '<p class="auth-sub">Log in with your mobile number or email.</p>' +
          '<form id="loginForm" novalidate>' +
            field("loginId", "Mobile number or email", { type: "text", inputmode: "email", autocomplete: "username", placeholder: "10-digit mobile or you@example.com" }) +
            field("loginPass", "Password", { type: "password", autocomplete: "current-password", placeholder: "Your password" }) +
            '<button class="btn btn--primary btn--block" id="loginBtn" type="submit">Log in</button>' +
          '</form>' +
          '<div class="auth-alt"><a href="#forgot" data-mode="forgot">Forgot password?</a></div>' +
          '<div class="auth-alt">New to AK Fishers? <a href="#signup" data-mode="signup">Create an account</a></div>';
      }

      function signupView() {
        var L = legacy || {};
        return '<h1>Create your account</h1>' +
          '<p class="auth-sub">Fresh seafood delivered to your door across Mumbai.</p>' +
          '<form id="signupForm" novalidate>' +
            field("suName", "Full name", { type: "text", autocomplete: "name", placeholder: "Your full name", value: L.name || "" }) +
            field("suMobile", "Mobile number", { type: "tel", inputmode: "numeric", autocomplete: "tel", maxlength: "10", placeholder: "10-digit mobile number", value: L.mobile || "" }) +
            field("suEmail", "Email", { type: "email", inputmode: "email", autocomplete: "email", placeholder: "you@example.com", optional: true, value: L.email || "" }) +
            field("suPass", "Password", { type: "password", autocomplete: "new-password", placeholder: "At least 8 characters" }) +
            field("suPass2", "Confirm password", { type: "password", autocomplete: "new-password", placeholder: "Re-enter password" }) +
            '<button class="btn btn--primary btn--block" id="signupBtn" type="submit">Create account</button>' +
          '</form>' +
          '<div class="auth-alt">Already have an account? <a href="#login" data-mode="login">Log in</a></div>';
      }

      function forgotView() {
        var wa = "https://wa.me/918108106522?text=" + encodeURIComponent("Hi AK Fishers, I need to reset my account password.");
        return '<h1>Reset your password</h1>' +
          '<p class="auth-sub">We\'ll verify your identity and reset it for you.</p>' +
          '<div class="cs-note" style="line-height:1.75">Message us on <a href="' + wa + '" target="_blank" rel="noopener"><b>WhatsApp</b></a> or call ' +
            '<a href="tel:+918108106522"><b>+91&nbsp;81081&nbsp;06522</b></a> (Mon–Sun, 7 AM – 9 PM) and mention the mobile number on your account.</div>' +
          '<a class="btn btn--primary btn--block mt-16" href="' + wa + '" target="_blank" rel="noopener">Message on WhatsApp</a>' +
          '<div class="auth-alt mt-16"><a href="#login" data-mode="login">Back to log in</a></div>';
      }

      function bindAuth(mode) {
        root.querySelectorAll("[data-mode]").forEach(function (a) {
          a.addEventListener("click", function (e) {
            e.preventDefault();
            if (busy) return;
            renderAuth(a.getAttribute("data-mode"));
          });
        });

        var loginForm = document.getElementById("loginForm");
        if (loginForm) {
          loginForm.addEventListener("submit", function (e) {
            e.preventDefault();
            if (busy) return;
            clearErrors();
            var id = document.getElementById("loginId").value.trim();
            var pw = document.getElementById("loginPass").value;
            var bad = false;
            if (!id) { fieldError("loginId", "Enter your mobile number or email."); bad = true; }
            if (!pw) { fieldError("loginPass", "Enter your password."); bad = true; }
            if (bad) return;

            var btn = document.getElementById("loginBtn");
            setBusy(btn, true, "Logging in…");
            AKF_USER.login(id, pw).then(function (res) {
              if (res.ok) { window.location.href = "/account"; return; }
              setBusy(btn, false);
              if (!applyServerFieldErrors(res.fields, { identifier: "loginId", password: "loginPass" })) {
                alertBox(res.message || "Login failed. Please try again.");
              }
            });
          });
        }

        var signupForm = document.getElementById("signupForm");
        if (signupForm) {
          signupForm.addEventListener("submit", function (e) {
            e.preventDefault();
            if (busy) return;
            clearErrors();
            var name = document.getElementById("suName").value.trim();
            var mobile = document.getElementById("suMobile").value.trim();
            var email = document.getElementById("suEmail").value.trim();
            var p1 = document.getElementById("suPass").value;
            var p2 = document.getElementById("suPass2").value;

            var bad = false;
            if (name.length < 2) { fieldError("suName", "Enter your full name."); bad = true; }
            if (!/^[6-9]\d{9}$/.test(mobile)) { fieldError("suMobile", "Enter a valid 10-digit Indian mobile number."); bad = true; }
            if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fieldError("suEmail", "Enter a valid email address."); bad = true; }
            if (p1.length < 8) { fieldError("suPass", "Password must be at least 8 characters."); bad = true; }
            if (p2 !== p1) { fieldError("suPass2", "Passwords do not match."); bad = true; }
            if (bad) return;

            var btn = document.getElementById("signupBtn");
            setBusy(btn, true, "Creating account…");
            AKF_USER.signup({ name: name, phone: mobile, email: email, password: p1 }).then(function (res) {
              if (res.ok) {
                try { localStorage.removeItem("akf_user"); } catch (e2) {}
                window.location.href = "/account";
                return;
              }
              setBusy(btn, false);
              if (res.error === "account_exists") {
                alertBox(res.message);
                fieldError("suMobile", "This number is already registered.");
              } else if (!applyServerFieldErrors(res.fields, { phone: "suMobile", password: "suPass", name: "suName", email: "suEmail" })) {
                alertBox(res.message || "Sign up failed. Please try again.");
              }
            });
          });
        }
      }

      /* ================= DASHBOARD VIEW ================= */
      function loadDashboard() {
        return Promise.all([api("orders.php"), api("addresses.php")]).then(function (r) {
          var srv = (r[0].ok && Array.isArray(r[0].body.orders)) ? r[0].body.orders : [];
          // merge in any device-local (guest) orders the server doesn't know about
          var seen = {}; srv.forEach(function (o) { seen[o.id] = true; });
          var merged = srv.concat(localOrders().filter(function (o) { return o && o.id && !seen[o.id]; }));
          DASH.orders = merged;
          DASH.addresses = (r[1].ok && Array.isArray(r[1].body.addresses)) ? r[1].body.addresses : [];
        });
      }

      function renderDashboard(panel) {
        panel = panel || "profile";
        var orders = DASH.orders;
        var addresses = DASH.addresses;

        var navItems = [
          { id: "profile", label: "My Profile", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' },
          { id: "addresses", label: "Saved Addresses", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' },
          { id: "orders", label: "Order History", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>' },
          { id: "tracking", label: "Order Tracking", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>' },
          { id: "logout", label: "Logout", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>' }
        ];

        root.innerHTML =
          '<section class="section" style="padding-top:30px">' +
            '<div class="container">' +
              '<div class="breadcrumbs"><a href="/">Home</a><span class="sep">›</span><span>My Account</span></div>' +
              '<div class="acct-layout">' +
                '<aside class="acct-side">' +
                  '<div class="as-user">' +
                    '<span class="as-avatar">' + esc(user.name ? user.name.charAt(0).toUpperCase() : "U") + '</span>' +
                    '<span><span class="as-name">' + esc(user.name || "Customer") + '</span><br><span class="as-mail">' + esc(user.phone || "") + '</span></span>' +
                  '</div>' +
                  '<nav>' +
                    navItems.map(function (n) {
                      return '<a href="#" data-panel="' + n.id + '" class="' + (n.id === panel ? "active" : "") + '">' + n.icon + ' ' + n.label + '</a>';
                    }).join("") +
                  '</nav>' +
                '</aside>' +
                '<div>' +
                  '<div class="acct-panel active" id="panel-profile">' + panelProfile() + '</div>' +
                  '<div class="acct-panel" id="panel-addresses">' + panelAddresses(addresses) + '</div>' +
                  '<div class="acct-panel" id="panel-orders">' + panelOrders(orders) + '</div>' +
                  '<div class="acct-panel" id="panel-tracking">' + panelTracking(orders) + '</div>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</section>';

        document.querySelectorAll("[data-panel]").forEach(function (a) {
          a.addEventListener("click", function (e) {
            e.preventDefault();
            if (busy) return;
            var p = a.getAttribute("data-panel");
            if (p === "logout") {
              setBusy(a, true);
              AKF_USER.logout().then(function () { window.location.href = "/account"; });
              return;
            }
            document.querySelectorAll("[data-panel]").forEach(function (x) { x.classList.remove("active"); });
            a.classList.add("active");
            document.querySelectorAll(".acct-panel").forEach(function (x) { x.classList.remove("active"); });
            document.getElementById("panel-" + p).classList.add("active");
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
        });

        var saveBtn = document.getElementById("saveProfile");
        if (saveBtn) {
          saveBtn.addEventListener("click", function () {
            if (busy) return;
            root.querySelectorAll('#panel-profile [data-field]').forEach(function (f) {
              f.classList.remove("has-error"); var e = f.querySelector(".field-error"); if (e) e.textContent = "";
            });
            alertBox("");
            var n = document.getElementById("pfName").value.trim();
            var em = document.getElementById("pfEmail").value.trim();
            var bad = false;
            if (n.length < 2) { fieldError("pfName", "Enter your full name."); bad = true; }
            if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { fieldError("pfEmail", "Enter a valid email address."); bad = true; }
            if (bad) return;

            setBusy(saveBtn, true, "Saving…");
            AKF_USER.updateProfile({ name: n, email: em }).then(function (res) {
              setBusy(saveBtn, false);
              if (res.ok) {
                user = res.user;
                var pm = document.getElementById("profileMsg");
                if (pm) { pm.className = "form-alert ok"; pm.textContent = "Profile updated."; }
                setTimeout(function () { renderDashboard("profile"); }, 700);
              } else if (res.error === "unauthenticated") {
                window.location.href = "/account";
              } else if (!applyServerFieldErrors(res.fields, { email: "pfEmail", name: "pfName" })) {
                var pm2 = document.getElementById("profileMsg");
                if (pm2) { pm2.className = "form-alert err"; pm2.textContent = res.message || "Could not save."; }
              }
            });
          });
        }

        var addAddr = document.getElementById("addAddress");
        if (addAddr) {
          addAddr.addEventListener("click", function () {
            if (busy) return;
            ["adFlat", "adBld", "adArea", "adPin"].forEach(function (id) { fieldError(id, ""); });
            var flat = document.getElementById("adFlat").value.trim();
            var bld = document.getElementById("adBld").value.trim();
            var area = document.getElementById("adArea").value.trim();
            var pin = document.getElementById("adPin").value.trim();
            var bad = false;
            if (!flat) { fieldError("adFlat", "Required."); bad = true; }
            if (!bld) { fieldError("adBld", "Required."); bad = true; }
            if (!area) { fieldError("adArea", "Required."); bad = true; }
            if (!/^\d{6}$/.test(pin)) { fieldError("adPin", "Enter a valid 6-digit pincode."); bad = true; }
            if (bad) return;

            setBusy(addAddr, true, "Saving…");
            api("addresses.php", { op: "add", flat: flat, building: bld, area: area, pincode: pin }).then(function (res) {
              setBusy(addAddr, false);
              if (res.ok) {
                DASH.addresses = res.body.addresses || [];
                AKF_TOAST("Address saved", "success");
                renderDashboard("addresses");
              } else if (res.status === 401) { window.location.href = "/account"; }
              else if (!applyServerFieldErrors(res.body.fields, { flat: "adFlat", building: "adBld", area: "adArea", pincode: "adPin" })) {
                AKF_TOAST(res.body.message || "Could not save the address.", "error");
              }
            });
          });
        }

        document.querySelectorAll("[data-del-addr]").forEach(function (b) {
          b.addEventListener("click", function () {
            if (busy) return;
            var id = parseInt(b.getAttribute("data-del-addr"), 10);
            setBusy(b, true);
            api("addresses.php", { op: "delete", id: id }).then(function (res) {
              busy = false;
              if (res.ok) { DASH.addresses = res.body.addresses || []; AKF_TOAST("Address removed", "info"); renderDashboard("addresses"); }
              else if (res.status === 401) { window.location.href = "/account"; }
              else AKF_TOAST(res.body.message || "Could not remove the address.", "error");
            });
          });
        });

        bindTracking();
        bindOrderCancel();
      }

      var _cancelTimers = [];
      function bindOrderCancel() {
        _cancelTimers.forEach(clearInterval); _cancelTimers = [];
        document.querySelectorAll("[data-cancel-order]").forEach(function (b) {
          b.addEventListener("click", function () {
            if (busy) return;
            var id = b.getAttribute("data-cancel-order");
            if (!confirm("Cancel order #" + id + "? This can't be undone.")) return;
            setBusy(b, true, "Cancelling…");
            api("orders.php", { op: "cancel", id: id }).then(function (res) {
              busy = false;
              if (res.ok) {
                AKF_TOAST("Order #" + id + " cancelled.", "info");
                loadDashboard().then(function () { renderDashboard("orders"); });
              } else {
                setBusy(b, false);
                AKF_TOAST(res.body.message || "Could not cancel the order.", "error");
              }
            });
          });
        });
        // live countdown — refresh the orders panel when a window elapses
        document.querySelectorAll("[data-cancel-timer]").forEach(function (el) {
          var id = el.getAttribute("data-cancel-timer");
          var o = (DASH.orders || []).filter(function (x) { return x.id === id; })[0];
          if (!o) return;
          var endAt = Date.now() + (o.cancelSecondsLeft || 0) * 1000;
          var tick = setInterval(function () {
            var left = Math.round((endAt - Date.now()) / 1000);
            if (left <= 0) { clearInterval(tick); if (document.getElementById("panel-orders")) renderDashboard("orders"); return; }
            el.textContent = left >= 60 ? Math.ceil(left / 60) + " min" : left + " sec";
          }, 1000);
          _cancelTimers.push(tick);
        });
      }

      function bindTracking() {
        var tb = document.getElementById("trackBtn");
        if (!tb) return;
        tb.addEventListener("click", function () {
          if (busy) return;
          var id = document.getElementById("trkId").value.trim().toUpperCase();
          var ph = document.getElementById("trkPhone").value.trim();
          fieldError("trkId", ""); fieldError("trkPhone", "");
          if (!/^AKF-\d{6}$/.test(id)) { fieldError("trkId", "Order number looks like AKF-123456."); return; }
          if (!/^[6-9]\d{9}$/.test(ph)) { fieldError("trkPhone", "Enter the 10-digit mobile on the order."); return; }
          setBusy(tb, true, "Checking…");
          api("track.php?id=" + encodeURIComponent(id) + "&phone=" + encodeURIComponent(ph)).then(function (res) {
            setBusy(tb, false);
            var box = document.getElementById("trkResult");
            if (res.ok && res.body.order) {
              var o = res.body.order;
              var steps = ["Order Confirmed", "Being Cleaned & Packed", "Out For Delivery", "Delivered"];
              box.innerHTML = '<div class="order-card" style="margin-top:14px"><div class="oc-head">' +
                '<span class="oc-id">#' + esc(o.id) + '</span>' +
                '<span class="oc-status ' + esc(o.status) + '">' + esc(o.status.charAt(0).toUpperCase() + o.status.slice(1)) + '</span></div>' +
                '<div class="oc-date">Placed ' + esc(o.placedOn) + ' · delivery ' + esc(o.deliveryDate) + ' (' + esc(o.slot) + ')</div>' +
                '<div class="track-steps mt-16">' + steps.map(function (s, i) {
                  return '<div class="track-step ' + (i < o.step ? "done" : i === o.step ? "current" : "") + '">' +
                    '<div class="ts-dot">' + (i < o.step ? "✓" : i + 1) + '</div><span>' + s + '</span></div>';
                }).join("") + '</div>' +
                '<div class="oc-total mt-16">Total: <b>' + akfFormatINR(o.total) + '</b> · ' + esc(o.payment) + '</div></div>';
            } else {
              box.innerHTML = '<p class="text-muted" style="margin-top:12px">' + esc(res.body.message || "No matching order found.") + '</p>';
            }
          });
        });
      }

      function panelProfile() {
        return '<h2>My Profile</h2>' +
          '<p class="ap-sub">Manage your personal information.</p>' +
          '<div class="checkout-card" style="max-width:560px">' +
            '<div id="profileMsg" class="form-alert" role="alert" aria-live="polite"></div>' +
            field("pfName", "Full Name", { type: "text", autocomplete: "name", value: user.name || "" }) +
            '<div class="field"><label for="pfMobile">Mobile Number</label>' +
              '<input id="pfMobile" type="tel" value="' + esc(user.phone || "") + '" readonly aria-readonly="true">' +
              '<div class="hint">To change your mobile number, contact us on WhatsApp.</div></div>' +
            field("pfEmail", "Email", { type: "email", inputmode: "email", autocomplete: "email", optional: true, value: user.email || "" }) +
            '<button class="btn btn--primary" id="saveProfile">Save Changes</button>' +
          '</div>';
      }

      function itemImg(it) {
        if (it.img) return it.img;
        var p = typeof akfGetProduct === "function" ? akfGetProduct(it.id) : null;
        return p ? p.img : "";
      }
      function statusClass(s) {
        return ["delivered", "cancelled", "out", "packed"].indexOf(s) > -1 ? s : "confirmed";
      }

      function panelAddresses(addresses) {
        var cards = addresses.length ? addresses.map(function (a) {
          return '<div class="addr-card' + (a.is_default ? " default" : "") + '" style="margin-bottom:14px">' +
            '<span class="ac-tag">' + esc(a.label) + (a.is_default ? " · Default" : "") + '</span>' +
            '<b>' + esc(a.flat) + '</b>' +
            '<p>' + esc(a.building) + ', ' + esc(a.area) + ', ' + esc(a.city) + ', ' + esc(a.state) + ' ' + esc(a.pincode) + '</p>' +
            '<div class="ac-actions"><button data-del-addr="' + a.id + '">Remove</button></div>' +
          '</div>';
        }).join("") : '<p class="text-muted">No saved addresses yet.</p>';

        return '<h2>Saved Addresses</h2>' +
          '<p class="ap-sub">Your delivery addresses, synced to your account for faster checkout on any device.</p>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start">' +
            '<div>' + cards + '</div>' +
            '<div class="checkout-card">' +
              '<h3 style="font-size:16px;margin-bottom:14px">Add New Address</h3>' +
              field("adFlat", "House / Flat", { type: "text", placeholder: "e.g. 402" }) +
              field("adBld", "Building / Society", { type: "text", placeholder: "Building name" }) +
              field("adArea", "Area / Locality", { type: "text", placeholder: "e.g. Bandra West" }) +
              field("adPin", "Pincode", { type: "text", inputmode: "numeric", maxlength: "6", placeholder: "400050" }) +
              '<button class="btn btn--primary btn--block" id="addAddress">Save Address</button>' +
            '</div>' +
          '</div>';
      }

      function panelOrders(orders) {
        if (!orders.length) {
          return '<h2>Order History</h2><p class="ap-sub">Your past orders will appear here.</p>' +
            '<div class="empty-state" style="border:1px solid var(--line-soft);border-radius:var(--r-lg)">' +
              '<div class="es-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></div>' +
              '<h3>No orders yet</h3><p>Your fresh seafood journey starts here.</p>' +
              '<a class="btn btn--primary" href="/shop">Shop Now</a>' +
            '</div>';
        }
        return '<h2>Order History</h2><p class="ap-sub">' + orders.length + ' order(s).</p>' +
          orders.map(function (o) {
            var canCancel = (o.cancelSecondsLeft || 0) > 0;
            return '<div class="order-card" data-order="' + esc(o.id) + '">' +
              '<div class="oc-head">' +
                '<span><span class="oc-id">#' + esc(o.id) + '</span><br><span class="oc-date">' + esc(o.date || "") + ' · ' + esc(o.slot || "") + '</span></span>' +
                '<span class="oc-status ' + statusClass(o.status) + '">' + esc((o.status || "confirmed").charAt(0).toUpperCase() + (o.status || "confirmed").slice(1)) + '</span>' +
              '</div>' +
              '<div class="oc-items">' +
                (o.items || []).map(function (i) { var im = itemImg(i); return im ? '<img src="' + esc(im) + '" alt="' + esc(i.name) + '" title="' + esc(i.name) + '">' : ''; }).join("") +
              '</div>' +
              '<div class="oc-total">Total: <b>' + akfFormatINR(o.total) + '</b> · ' + esc(o.payment || "") + '</div>' +
              (canCancel
                ? '<div class="oc-cancel-row" style="margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
                    '<button class="btn btn--ghost btn--sm" data-cancel-order="' + esc(o.id) + '">Cancel order</button>' +
                    '<span class="text-muted" style="font-size:12.5px">Free cancellation for <b data-cancel-timer="' + esc(o.id) + '">' + Math.ceil(o.cancelSecondsLeft / 60) + ' min</b></span>' +
                  '</div>'
                : (o.status === "confirmed"
                    ? '<div class="text-muted" style="font-size:12.5px;margin-top:10px">To cancel this order, call us on +91 81081 06522.</div>'
                    : '')) +
            '</div>';
          }).join("");
      }

      function panelTracking(orders) {
        var active = orders.filter(function (o) { return o.status !== "delivered" && o.status !== "cancelled"; })[0] || orders[0];
        var live = "";
        if (active) {
          var steps = ["Order Confirmed", "Being Cleaned & Packed", "Out For Delivery", "Delivered"];
          var idx = active.status === "packed" ? 1 : active.status === "out" ? 2 : active.status === "delivered" ? 3 : 0;
          live = '<h3 style="margin-top:6px">Latest order · #' + esc(active.id) + '</h3>' +
            '<div class="checkout-card">' +
              '<div class="track-steps">' + steps.map(function (s, i) {
                return '<div class="track-step ' + (i < idx ? "done" : i === idx ? "current" : "") + '">' +
                  '<div class="ts-dot">' + (i < idx ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M20 6L9 17l-5-5"/></svg>' : i + 1) + '</div>' +
                  '<span>' + s + '</span></div>';
              }).join("") + '</div>' +
              (active.address ? '<div class="cs-note mt-16">📦 Delivering to: ' + esc(active.address) + '</div>' : '') +
            '</div>';
        }
        return '<h2>Order Tracking</h2>' +
          '<p class="ap-sub">Follow your live order, or look up any order by its number.</p>' +
          live +
          '<div class="checkout-card" style="max-width:520px;margin-top:16px">' +
            '<h3 style="font-size:16px;margin-bottom:12px">Track any order</h3>' +
            field("trkId", "Order number", { type: "text", placeholder: "AKF-123456" }) +
            field("trkPhone", "Mobile number on the order", { type: "tel", inputmode: "numeric", maxlength: "10", placeholder: "10-digit mobile" }) +
            '<button class="btn btn--primary" id="trackBtn">Check status</button>' +
            '<div id="trkResult"></div>' +
          '</div>';
      }

      function renderStaffNotice() {
        root.innerHTML =
          '<section class="section" style="padding-top:40px"><div class="container">' +
            '<div class="breadcrumbs"><a href="/">Home</a><span class="sep">›</span><span>My Account</span></div>' +
            '<div class="auth-card" style="max-width:460px;margin:20px auto;text-align:center">' +
              '<span class="as-avatar" style="margin:0 auto 14px">' + esc(user.name ? user.name.charAt(0).toUpperCase() : "A") + '</span>' +
              '<h2 style="margin-bottom:8px">You\'re signed in as staff</h2>' +
              '<p class="ap-sub">This account (<b>' + esc(user.name || user.phone) + '</b>) is an administrator, not a shopping account. ' +
                'Use the admin panel to manage orders, customers and delivery.</p>' +
              '<a class="btn btn--primary btn--block" href="/admin">Open Admin Panel</a>' +
              '<a class="btn btn--ghost btn--block mt-8" href="#" id="staffLogout">Sign out</a>' +
              '<p class="text-muted" style="font-size:12.5px;margin-top:14px">To place an order as a customer, sign out and use a personal account.</p>' +
            '</div>' +
          '</div></section>';
        var lo = document.getElementById("staffLogout");
        if (lo) lo.addEventListener("click", function (e) {
          e.preventDefault();
          AKF_USER.logout().then(function () { window.location.href = "/account"; });
        });
      }

      /* ---------- Init: ask the server who we are, then render ---------- */
      var hash = window.location.hash.replace("#", "");
      AKF_USER.refresh().then(function (u) {
        user = u;
        if (user && user.isAdmin) {
          renderStaffNotice();
        } else if (user) {
          var startPanel = ["profile", "addresses", "orders", "tracking"].indexOf(hash) > -1 ? hash : "profile";
          renderDashboard(startPanel);
          loadDashboard().then(function () { renderDashboard(startPanel); });
        } else if (AKF_USER.backendReady === false) {
          renderAuth("login");
          alertBox("Accounts are being set up right now — please check back shortly. You can still place an order as a guest.", "err");
          var f = root.querySelector(".auth-card form");
          if (f) f.querySelectorAll("input, button").forEach(function (el) { el.disabled = true; });
        } else {
          var startMode = hash === "signup" ? "signup" : hash === "forgot" ? "forgot" : "login";
          var haveLegacy = legacy && (legacy.name || legacy.mobile);
          if (haveLegacy && startMode === "login") startMode = "signup";   // returning device, no real account yet
          renderAuth(startMode);
          if (haveLegacy && startMode === "signup") {
            alertBox("We've upgraded to secure accounts. Create yours below — your saved details are filled in.", "ok");
          }
        }
      });
    })();
  </script>
</body>
</html>
